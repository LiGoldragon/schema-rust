[package]
name         = "schema-rust"
version      = "0.17.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/schema-rust"
description  = "Verified bootstrap Ethos generation through Nomos and Rust Logos."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "schema_rust"
path = "src/lib.rs"

[dependencies]
core-ethos = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "cc32c507da45998a18682af939915d192d902b9f" }
core-nomos = { git = "https://github.com/LiGoldragon/core-nomos.git", rev = "a982f4d8ceea0bb41718ba000fd492b2802c3a74" }
rust-logos = { git = "https://github.com/LiGoldragon/rust-logos.git", rev = "6805e1e570cb5a853d47484c5ad9148e6d2d238" }
sema-translator = { git = "https://github.com/LiGoldragon/sema-translator.git", rev = "813600d85d414b4bc43c20a2e6f280d1814c8320", default-features = false, features = ["bootstrap"] }
thiserror = "2"

[dev-dependencies]
name-table = { git = "https://github.com/LiGoldragon/name-table.git", rev = "7dd5db15c16b4246c83d049c759415d3252a7d43" }
syn = { version = "2", features = ["full"] }
tempfile = "3"

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
