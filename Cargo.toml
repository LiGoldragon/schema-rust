[package]
name         = "schema-rust"
version      = "0.9.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/schema-rust"
description  = "Rust source emitter for schema typed schema data."
publish      = false

[lib]
name = "schema_rust"
path = "src/lib.rs"

[dependencies]
nota = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", rev = "f8de7a516b769fc544c7f8c0030e258833c1cf9b" }
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
schema-language = { git = "https://github.com/LiGoldragon/schema-language.git", rev = "7fac6ac810bc" }
syn = { version = "2", features = ["full"] }
thiserror = "2"
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "d93ad0d08e46" }

[features]
# Activates the `#[cfg(feature = "nota-text")]` blocks inside any
# schema-emitted fixture this crate's tests `include!`. The emitter
# itself doesn't gate any of its own code on this feature; it only
# controls whether the included generated source carries its NOTA
# bridges. Defaulting it on keeps the existing test paths
# (`generated::Input::from_str`, `generated::*::to_nota`, the
# `nota::*` re-exports) live without per-test cargo flags.
default   = ["nota-text"]
nota-text = []

[dev-dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "653a44b7dcd3d0de9e6b9358d1806413680eda67" }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "b61ec7d9e98e" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
