[package]
name         = "schema-rust"
version      = "0.10.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/schema-rust"
description  = "Rust source emitter for schema typed schema data."
publish      = false

[lib]
name = "schema_rust"
path = "src/lib.rs"

[[bin]]
name = "schema-rust"
path = "src/bin/schema-rust.rs"
required-features = ["cli"]

[dependencies]
dotos = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3cf547d2624c6a243e5de5f85c9f3" }
prettyplease = "0.2"
proc-macro2 = "1"
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "937dd7df657f685cdd1ebd6f2148ad428a8b36bf" }
quote = "1"
schema-language = { git = "https://github.com/LiGoldragon/schema-language.git", rev = "5a7c713dd7c1e095970b26149c6ed5553dd1c715" }
syn = { version = "2", features = ["full"] }
thiserror = "2"
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "e44c07dbf314", optional = true }

[features]
# Activates the `#[cfg(feature = "dotos-text")]` blocks inside any
# schema-emitted fixture this crate's tests `include!`. The emitter
# itself doesn't gate any of its own code on this feature; it only
# controls whether the included generated source carries its DOTOS
# bridges. Defaulting it on keeps the existing test paths
# (`generated::Input::from_str`, `generated::*::to_dotos`, the
# `dotos::*` re-exports) live without per-test cargo flags.
default   = ["dotos-text", "cli"]
dotos-text = []
cli = ["dep:triad-runtime"]

[dev-dependencies]
rkyv = { version = "=0.8.17", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "0786fbe8caf27552afcdd5deb85bc82ec6088337" }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread"] }
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "e44c07dbf314" }
trybuild = "1"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
