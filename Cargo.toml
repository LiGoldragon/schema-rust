[package]
name         = "schema-rust"
version      = "0.10.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/schema-rust"
description  = "Rust source emitter for schema typed schema data."
publish      = false

[lib]
name = "schema_rust"
path = "src/lib.rs"

[[bin]]
name = "schema-rust"
path = "src/bin/schema-rust.rs"
required-features = ["cli"]

[dependencies]
nota = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", rev = "89dc3c85a9ff96d4e4d53accfd867df672cae5a8" }
prettyplease = "0.2"
proc-macro2 = "1"
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "9bce5ed8efadeb157811b256aa69a1f88cd5314f" }
quote = "1"
schema-language = { git = "https://github.com/LiGoldragon/schema-language.git", rev = "9c217610c4b8d3bdaa9f95542e28c04424a593e3" }
syn = { version = "2", features = ["full"] }
thiserror = "2"
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "acfb386fa638e2979b33bf2d003bb35fed0ceec0", optional = true }

[features]
# Activates the `#[cfg(feature = "nota-text")]` blocks inside any
# schema-emitted fixture this crate's tests `include!`. The emitter
# itself doesn't gate any of its own code on this feature; it only
# controls whether the included generated source carries its NOTA
# bridges. Defaulting it on keeps the existing test paths
# (`generated::Input::from_str`, `generated::*::to_nota`, the
# `nota::*` re-exports) live without per-test cargo flags.
default   = ["nota-text", "cli"]
nota-text = []
cli = ["dep:triad-runtime"]

[dev-dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "0786fbe8caf27552afcdd5deb85bc82ec6088337" }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread"] }
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "acfb386fa638e2979b33bf2d003bb35fed0ceec0" }
trybuild = "1"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
