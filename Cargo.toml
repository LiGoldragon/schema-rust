[package]
name         = "schema-rust"
version      = "0.17.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/schema-rust"
description  = "Verified bootstrap Ethos generation through Nomos and Rust Logos."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "schema_rust"
path = "src/lib.rs"

[dependencies]
blake3   = "1"
core-ethos = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "2828bf8d94b92ad394c1c16cccdca61f28599c2e" }
core-nomos = { git = "https://github.com/LiGoldragon/core-nomos.git", rev = "a7a27fc6d7ce85796e2128b39f243e3a31a4e195" }
rust-logos = { git = "https://github.com/LiGoldragon/rust-logos.git", rev = "7e1ca50e79ce1dc67e2ef0794f09cec8201fcb2d" }
memory-translator = { git = "https://github.com/LiGoldragon/memory-translator.git", rev = "bb38be4f408a0c8cb82beb12f8e3530e0166493e", default-features = false, features = ["bootstrap"] }
thiserror = "2"

[dev-dependencies]
name-table = { git = "https://github.com/LiGoldragon/name-table.git", rev = "7dd5db15c16b4246c83d049c759415d3252a7d43" }
syn = { version = "2", features = ["full"] }
tempfile = "3"

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
