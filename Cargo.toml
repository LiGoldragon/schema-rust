[package]
name         = "schema-rust"
version      = "0.16.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/schema-rust"
description  = "Verified bootstrap Ethos generation through Nomos and Rust Logos."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "schema_rust"
path = "src/lib.rs"

[dependencies]
core-ethos = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "43b48c779c54ee9f05cbcc111d5d88074b162461" }
core-nomos = { git = "https://github.com/LiGoldragon/core-nomos.git", rev = "7b60721d199551b648d42a49934a2f0ef950c595" }
rust-logos = { git = "https://github.com/LiGoldragon/rust-logos.git", rev = "82e0e5c10f6efb2d53330d72ba78dd3ac695f38a" }
sema-translator = { git = "https://github.com/LiGoldragon/sema-translator.git", rev = "4bd6e8fa0c3139be94a83c7ca7975bd8153eb9f5", default-features = false, features = ["bootstrap"] }
thiserror = "2"

[dev-dependencies]
name-table = { git = "https://github.com/LiGoldragon/name-table.git", rev = "a22f48d8040ab9235f3552ad8654ff8e27b8157d" }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "3f41813dd63904c7e2b3da4382eff64ed1bf12fe" }
structural-codec = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "879d76f91facedd6d5cbca79e282260e1beb9478" }
syn = { version = "2", features = ["full"] }
tempfile = "3"

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
